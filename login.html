<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GeoShield | Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="login-page">

    <div class="login-container">

        <div class="login-logo">
            🛡️
        </div>

        <h1>Welcome to GeoShield</h1>

        <p>
            Sign in to access your security dashboard.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit" class="primary-button login-button">
                Login →
            </button>

        </form>


        <div class="demo-box">

            <h3>Demo Account</h3>

            <p>
                Email:
                <strong>demo@geoshield.com</strong>
            </p>

            <p>
                Password:
                <strong>demo123</strong>
            </p>

        </div>


        <a href="/" class="back-link">
            ← Back to Home
        </a>

    </div>

</body>

</html>
